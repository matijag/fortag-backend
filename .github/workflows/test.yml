name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scanner/go.mod
          cache-dependency-path: scanner/go.sum
      - name: Test scanner
        working-directory: scanner
        run: go test -race ./...

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build scanner image
        uses: docker/build-push-action@v6
        with:
          context: scanner
          file: scanner/Dockerfile
          push: false
          tags: fortag-backend:test
          build-args: BUILD_VERSION=ci
